<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventaire — Gestion de Stock</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f1117;
  --bg2:#171b26;
  --bg3:#1e2333;
  --border:rgba(255,255,255,0.07);
  --text:#e8eaf0;
  --muted:#6b7280;
  --accent:#4f8ef7;
  --danger:#f87171;
  --warn:#fbbf24;
  --ok:#34d399;
  --sell:#a78bfa;
  --radius:12px;
  --font:'DM Sans',sans-serif;
  --mono:'DM Mono',monospace;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
}

nav{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:0 2rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:56px;
  position:sticky;
  top:0;
  z-index:100;
}

.nav-logo{
  font-size:15px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:8px;
}

.nav-logo span{
  width:28px;
  height:28px;
  background:var(--accent);
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

.nav-tabs{
  display:flex;
  gap:4px;
}

.nav-tab{
  padding:6px 14px;
  border-radius:8px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  border:none;
  background:transparent;
  color:var(--muted);
}

.nav-tab.active{
  background:var(--bg3);
  color:var(--text);
}

.nav-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.btn{
  padding:7px 14px;
  border-radius:8px;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  border:none;
}

.btn-primary{
  background:var(--accent);
  color:#fff;
}

.btn-danger{
  background:rgba(248,113,113,.15);
  color:var(--danger);
  border:1px solid rgba(248,113,113,.2);
}

.btn-green{
  background:rgba(52,211,153,.15);
  color:var(--ok);
  border:1px solid rgba(52,211,153,.2);
}

.btn-ghost{
  background:var(--bg3);
  color:var(--text);
  border:1px solid var(--border);
}

.btn-sm{
  padding:4px 10px;
  font-size:12px;
}

main{
  max-width:1280px;
  margin:0 auto;
  padding:2rem;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.table-wrap{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead th{
  text-align:left;
  padding:.85rem 1rem;
  font-size:11px;
  font-weight:600;
  color:var(--muted);
  text-transform:uppercase;
  border-bottom:1px solid var(--border);
  background:var(--bg3);
}

tbody td{
  padding:.8rem 1rem;
  font-size:13px;
  border-bottom:1px solid var(--border);
}

tbody tr:hover{
  background:var(--bg3);
}

.stock-toolbar{
  display:flex;
  gap:10px;
  margin-bottom:1.25rem;
}

.search-wrap{
  flex:1;
}

.search-wrap input{
  width:100%;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 12px;
  color:var(--text);
}

.filter-select{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 12px;
  color:var(--text);
}

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
}

.modal-overlay.open{
  opacity:1;
  pointer-events:all;
}

.modal{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:16px;
  width:600px;
  max-width:95vw;
}

.modal-header{
  padding:1.25rem 1.5rem;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-body{
  padding:1.5rem;
}

.modal-footer{
  padding:1rem 1.5rem;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:1rem;
}

.form-group input,
.form-group select{
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px 12px;
  color:var(--text);
}

.modal-close{
  background:none;
  border:none;
  color:var(--muted);
  font-size:20px;
  cursor:pointer;
}

.status-ok{
  color:var(--ok);
}

.status-warn{
  color:var(--warn);
}

.status-danger{
  color:var(--danger);
}

.empty{
  text-align:center;
  padding:3rem;
  color:var(--muted);
}
</style>
</head>

<body>

<nav>
  <div class="nav-logo">
    <span>📦</span>
    StockManager
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('stock',this)">
      Stock
    </button>

    <button class="nav-tab" onclick="showPage('mouvements',this)">
      📈 Mouvements
    </button>
  </div>

  <div class="nav-right">
    <button class="btn btn-primary" onclick="openProductModal()">
      + Ajouter
    </button>
  </div>
</nav>

<main>

<!-- PAGE STOCK -->
<div class="page active" id="page-stock">

  <div class="stock-toolbar">

    <div class="search-wrap">
      <input
        type="text"
        id="search-input"
        placeholder="Rechercher..."
        oninput="renderStock()">
    </div>

    <select class="filter-select" id="cat-filter" onchange="renderStock()">
      <option value="">Toutes catégories</option>
      <option>Matières premières</option>
      <option>Produits finis</option>
      <option>Revente directe</option>
    </select>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>Produit</th>
          <th>Catégorie</th>
          <th>Stock</th>
          <th>Prix achat</th>
          <th>Prix vente</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="stock-tbody"></tbody>

    </table>

  </div>

</div>

<!-- PAGE MOUVEMENTS -->
<div class="page" id="page-mouvements">

  <div style="margin-bottom:1rem">
    <h2>Historique des mouvements</h2>
  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Produit</th>
          <th>Quantité</th>
          <th>Événement</th>
        </tr>
      </thead>

      <tbody id="movements-tbody"></tbody>

    </table>

  </div>

</div>

</main>

<!-- MODAL PRODUIT -->
<div class="modal-overlay" id="modal-product">

  <div class="modal">

    <div class="modal-header">
      <h3>Produit</h3>

      <button class="modal-close"
      onclick="closeModal('modal-product')">
        ✕
      </button>
    </div>

    <div class="modal-body">

      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="f-nom">
      </div>

      <div class="form-group">
        <label>Catégorie</label>

        <select id="f-cat">
          <option>Matières premières</option>
          <option>Produits finis</option>
          <option>Revente directe</option>
        </select>
      </div>

      <div class="form-group">
        <label>Quantité</label>
        <input type="number" id="f-qty">
      </div>

      <div class="form-group">
        <label>Prix achat</label>
        <input type="number" id="f-achat">
      </div>

      <div class="form-group">
        <label>Prix vente</label>
        <input type="number" id="f-vente">
      </div>

    </div>

    <div class="modal-footer">

      <button class="btn btn-ghost"
      onclick="closeModal('modal-product')">
        Annuler
      </button>

      <button class="btn btn-primary"
      onclick="saveProduct()">
        Enregistrer
      </button>

    </div>

  </div>

</div>

<!-- MODAL ACHAT / VENTE -->
<div class="modal-overlay" id="modal-movement">

  <div class="modal" style="width:420px">

    <div class="modal-header">

      <h3 id="movement-title">
        Mouvement
      </h3>

      <button class="modal-close"
      onclick="closeModal('modal-movement')">
        ✕
      </button>

    </div>

    <div class="modal-body">

      <div class="form-group">
        <label>Quantité</label>

        <input
          type="number"
          id="movement-qty"
          min="0.01"
          step="0.01">
      </div>

      <div class="form-group">

        <label>Événement</label>

        <input
          type="text"
          id="movement-event"
          placeholder="Ex: Marché de Noël">

      </div>

    </div>

    <div class="modal-footer">

      <button class="btn btn-ghost"
      onclick="closeModal('modal-movement')">
        Annuler
      </button>

      <button class="btn btn-primary"
      onclick="confirmMovement()">
        Valider
      </button>

    </div>

  </div>

</div>

<script>

// ==============================
// DATA
// ==============================

let products = JSON.parse(localStorage.getItem('products') || 'null') || [

  {
    id:1,
    nom:'Farine',
    cat:'Matières premières',
    qty:100,
    achat:1.2,
    vente:0
  },

  {
    id:2,
    nom:'Crêpe',
    cat:'Produits finis',
    qty:20,
    achat:0.8,
    vente:4
  }

];

let movements =
  JSON.parse(localStorage.getItem('movements') || '[]');

let editingId = null;

let nextId =
  Math.max(...products.map(p=>p.id),0)+1;

// ==============================
// STORAGE
// ==============================

function saveLocal(){
  localStorage.setItem(
    'products',
    JSON.stringify(products)
  );
}

function saveMovements(){
  localStorage.setItem(
    'movements',
    JSON.stringify(movements)
  );
}

// ==============================
// NAVIGATION
// ==============================

function showPage(name,btn){

  document.querySelectorAll('.page')
    .forEach(p=>p.classList.remove('active'));

  document.querySelectorAll('.nav-tab')
    .forEach(t=>t.classList.remove('active'));

  document.getElementById('page-'+name)
    .classList.add('active');

  btn.classList.add('active');

  if(name==='stock'){
    renderStock();
  }

  if(name==='mouvements'){
    renderMovements();
  }
}

// ==============================
// STOCK
// ==============================

function renderStock(){

  const q =
    document.getElementById('search-input')
    .value
    .toLowerCase();

  const cat =
    document.getElementById('cat-filter').value;

  const filtered = products.filter(p=>{

    const okSearch =
      !q ||
      p.nom.toLowerCase().includes(q);

    const okCat =
      !cat ||
      p.cat===cat;

    return okSearch && okCat;
  });

  const tbody =
    document.getElementById('stock-tbody');

  if(!filtered.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="6">
          <div class="empty">
            Aucun produit
          </div>
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = filtered.map(p=>`

    <tr>

      <td>${p.nom}</td>

      <td>${p.cat}</td>

      <td>${p.qty}</td>

      <td>${p.achat} €</td>

      <td>${p.vente} €</td>

      <td style="display:flex;gap:4px">

        <button
          class="btn btn-green btn-sm"
          onclick="openMovementModal(${p.id},'achat')">

          + Achat

        </button>

        <button
          class="btn btn-danger btn-sm"
          onclick="openMovementModal(${p.id},'vente')">

          - Vente

        </button>

        <button
          class="btn btn-ghost btn-sm"
          onclick="openProductModal(${p.id})">

          ✏️

        </button>

      </td>

    </tr>

  `).join('');
}

// ==============================
// MOUVEMENTS
// ==============================

function renderMovements(){

  const tbody =
    document.getElementById('movements-tbody');

  if(!movements.length){

    tbody.innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            Aucun mouvement
          </div>
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML =
    [...movements]
    .reverse()
    .map(m=>`

      <tr>

        <td>${m.date}</td>

        <td>

          ${
            m.type==='achat'
            ? '<span class="status-ok">🟢 Achat</span>'
            : '<span class="status-danger">🔴 Vente</span>'
          }

        </td>

        <td>${m.productName}</td>

        <td>${m.qty}</td>

        <td>${m.evenement || '—'}</td>

      </tr>

    `)
    .join('');
}

// ==============================
// PRODUIT
// ==============================

function openProductModal(id=null){

  editingId = id;

  const p =
    products.find(x=>x.id===id);

  document.getElementById('f-nom').value =
    p?.nom || '';

  document.getElementById('f-cat').value =
    p?.cat || 'Matières premières';

  document.getElementById('f-qty').value =
    p?.qty || 0;

  document.getElementById('f-achat').value =
    p?.achat || 0;

  document.getElementById('f-vente').value =
    p?.vente || 0;

  openModal('modal-product');
}

function saveProduct(){

  const data = {

    nom:
      document.getElementById('f-nom').value,

    cat:
      document.getElementById('f-cat').value,

    qty:
      parseFloat(
        document.getElementById('f-qty').value
      ) || 0,

    achat:
      parseFloat(
        document.getElementById('f-achat').value
      ) || 0,

    vente:
      parseFloat(
        document.getElementById('f-vente').value
      ) || 0

  };

  if(editingId){

    const idx =
      products.findIndex(
        p=>p.id===editingId
      );

    products[idx] = {
      ...products[idx],
      ...data
    };

  } else {

    products.push({
      id:nextId++,
      ...data
    });

  }

  saveLocal();

  closeModal('modal-product');

  renderStock();
}

// ==============================
// ACHAT / VENTE
// ==============================

let movementProductId = null;
let movementType = null;

function openMovementModal(productId,type){

  movementProductId = productId;
  movementType = type;

  document.getElementById('movement-title')
    .textContent =
      type==='achat'
      ? 'Ajouter un achat'
      : 'Enregistrer une vente';

  document.getElementById('movement-qty').value='';
  document.getElementById('movement-event').value='';

  openModal('modal-movement');
}

function confirmMovement(){

  const qty =
    parseFloat(
      document.getElementById('movement-qty').value
    ) || 0;

  const evenement =
    document.getElementById('movement-event')
    .value
    .trim();

  if(qty<=0){

    alert('Quantité invalide');

    return;
  }

  const idx =
    products.findIndex(
      p=>p.id===movementProductId
    );

  if(idx<0)return;

  if(movementType==='achat'){

    products[idx].qty += qty;

  } else {

    if(products[idx].qty < qty){

      const ok = confirm(
        'Stock insuffisant. Continuer ?'
      );

      if(!ok)return;
    }

    products[idx].qty =
      Math.max(
        0,
        products[idx].qty - qty
      );
  }

  movements.push({

    id:Date.now(),

    type:movementType,

    productId:movementProductId,

    productName:products[idx].nom,

    qty,

    evenement,

    date:new Date().toLocaleString('fr-FR')

  });

  saveLocal();
  saveMovements();

  renderStock();
  renderMovements();

  closeModal('modal-movement');
}

// ==============================
// MODALS
// ==============================

function openModal(id){
  document
    .getElementById(id)
    .classList
    .add('open');
}

function closeModal(id){
  document
    .getElementById(id)
    .classList
    .remove('open');
}

// ==============================
// INIT
// ==============================

renderStock();

</script>

</body>
</html>
